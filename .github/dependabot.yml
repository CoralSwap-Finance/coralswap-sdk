version: 2
updates:
  # npm dependency updates
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Reviewer assignment is managed by .github/CODEOWNERS, which requires
    # maintainer review for package.json and package-lock.json changes.
    # The deprecated `reviewers` key has been removed.

  # GitHub Actions pin updates — keep SHAs current automatically
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Reviewer assignment is managed by .github/CODEOWNERS (.github/** path).
