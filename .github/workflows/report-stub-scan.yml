name: Report stub scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  report-stubs:
    name: Report paths contain no stub-shaped literal returns
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Scan report modules
        run: node scripts/check-report-stubs.mjs
