name: fix-tests
on:
  push:
    branches:
      - fix/492-swap-zod-validation
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          sed -i "s/EXPCT_IN/EXACT_IN/g" tests/swap-validation.test.ts
          sed -i "s/tokem/token/g" tests/swap-validation.test.ts
          rm -f .github/workflows/fix-tests.yml
          git config user.email "isaac4real-art@users.noreply.github.com"
          git config user.name "isaac4real-art"
          git add -A
          git commit -m "fix(test): correct EXACT_IN and tokenOut typos"
          git push
