name: Benchmark Regression

# Refreshing the baseline
# -----------------------
# The baseline is captured automatically on every push to `main`.
# On a PR the job looks up the latest *successful* main-branch run, downloads
# its `benchmark-baseline` artifact, and compares medians.
#
# To accept an intentional regression, merge the change to main — the next
# baseline upload will make it the new reference.  Then re-run the PR check.
#
# Permissions required by this workflow:
#   actions: read   — to look up and download the baseline artifact cross-run
#   pull-requests: write — to post/update the regression comment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BENCHMARK_RPC_LATENCY_MS: 5
  BENCHMARK_ITERATIONS: 50
  BENCHMARK_VARIANCE_TARGET: 10

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci --ignore-scripts

      - name: Run benchmarks
        run: npm run benchmark -- --output benchmarks/results.json

      - name: Upload PR results artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-results-pr-${{ github.event.number }}
          path: benchmarks/results.json

      - name: Upload baseline artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-baseline
          path: benchmarks/results.json
          overwrite: true

      # -----------------------------------------------------------------------
      # Cross-run baseline download
      #
      # Without `run-id`, download-artifact only searches the *current* run —
      # but the baseline was uploaded by a push-to-main run, not this PR run.
      # We first look up the most recent successful main-branch run that has
      # the `benchmark-baseline` artifact, then pass its run-id explicitly.
      # Requires `actions: read` permission (set at the top of this workflow).
      # -----------------------------------------------------------------------
      - name: Find latest baseline run-id
        id: baseline_run
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          result-encoding: string
          script: |
            // List recent workflow runs on main that succeeded and belong to
            // this workflow file.
            const { data: runsPage } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'benchmarks.yml',
              branch: 'main',
              status: 'success',
              per_page: 20,
            });

            for (const run of runsPage.workflow_runs) {
              // Check whether this run has the baseline artifact.
              const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
              });
              const hasBaseline = artifacts.artifacts.some(
                (a) => a.name === 'benchmark-baseline'
              );
              if (hasBaseline) {
                core.info(`Found baseline in run ${run.id} (${run.created_at})`);
                return String(run.id);
              }
            }
            core.warning('No main-branch run with a benchmark-baseline artifact found.');
            return '';

      - name: Download baseline artifact
        if: github.event_name == 'pull_request' && steps.baseline_run.outputs.result != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: benchmark-baseline
          path: benchmarks/baseline
          run-id: ${{ steps.baseline_run.outputs.result }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compare against baseline
        id: compare
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          BASELINE="benchmarks/baseline/results.json"
          PR_RESULTS="benchmarks/results.json"
          REPORT="benchmarks/regression-report.md"

          if [ ! -f "$BASELINE" ]; then
            echo "No baseline found — skipping comparison."
            echo "has_baseline=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_baseline=true" >> "$GITHUB_OUTPUT"

          cat > "$REPORT" << 'REPORT_HEADER'
          # Benchmark Regression Report

          | Operation | Baseline (ms) | PR (ms) | Change | CV % | Verdict |
          |-----------|--------------|---------|--------|------|---------|
          REPORT_HEADER

          any_failure=false
          any_warning=false
          BASELINE_COUNT=$(jq '.results | length' "$BASELINE")

          for i in $(seq 0 $((BASELINE_COUNT - 1))); do
            NAME=$(jq -r ".results[$i].name" "$BASELINE")

            # Use median_latency_ms if available; fall back to avg_latency_ms.
            BASELINE_AVG=$(jq ".results[$i] | .median_latency_ms // .avg_latency_ms" "$BASELINE")

            PR_AVG=$(jq -r ".results[] | select(.name == \"$NAME\") | (.median_latency_ms // .avg_latency_ms)" "$PR_RESULTS")
            PR_CV=$(jq -r ".results[] | select(.name == \"$NAME\") | (.cv_percent // 0)" "$PR_RESULTS")
            PR_HIGH_VARIANCE=$(jq -r ".results[] | select(.name == \"$NAME\") | (.high_variance // false)" "$PR_RESULTS")

            if [ -z "$PR_AVG" ] || [ "$PR_AVG" = "null" ]; then
              echo "| $NAME | $BASELINE_AVG | N/A | N/A | - | ⚠️ Missing |" >> "$REPORT"
              continue
            fi

            # Skip high-variance results — they would flap between pass and fail.
            if [ "$PR_HIGH_VARIANCE" = "true" ]; then
              echo "| $NAME | $BASELINE_AVG | $PR_AVG | skipped | ${PR_CV}% | ⚠️ High variance (CV>${BENCHMARK_VARIANCE_TARGET}%) |" >> "$REPORT"
              continue
            fi

            if [ "$(echo "$BASELINE_AVG == 0" | bc -l)" -eq 1 ]; then
              echo "| $NAME | $BASELINE_AVG | $PR_AVG | N/A | ${PR_CV}% | ✅ Zero baseline |" >> "$REPORT"
              continue
            fi

            CHANGE_PCT=$(echo "scale=6; ($PR_AVG - $BASELINE_AVG) / $BASELINE_AVG * 100" | bc -l)
            CHANGE_PCT=$(printf "%.2f" "$CHANGE_PCT")

            if [ "$(echo "$CHANGE_PCT > 50" | bc -l)" -eq 1 ]; then
              VERDICT="❌ Failure (>50%)"
              any_failure=true
            elif [ "$(echo "$CHANGE_PCT > 20" | bc -l)" -eq 1 ]; then
              VERDICT="⚠️ Warning (>20%)"
              any_warning=true
            elif [ "$(echo "$CHANGE_PCT < -5" | bc -l)" -eq 1 ]; then
              VERDICT="✅ Improvement"
            else
              VERDICT="✅"
            fi

            echo "| $NAME | $BASELINE_AVG | $PR_AVG | $CHANGE_PCT% | ${PR_CV}% | $VERDICT |" >> "$REPORT"
          done

          echo "" >> "$REPORT"
          echo "**Thresholds:** ⚠️ Warning > 20% | ❌ Failure > 50% | Variance target: CV ≤ ${BENCHMARK_VARIANCE_TARGET}%" >> "$REPORT"
          echo "" >> "$REPORT"
          echo "**How to refresh the baseline:** merge to \`main\` — the next push uploads a new artifact." >> "$REPORT"
          echo "" >> "$REPORT"

          if [ "$any_failure" = "true" ]; then
            echo "result=failure" >> "$GITHUB_OUTPUT"
            echo "❌ **FAILURE**: One or more operations regressed by more than 50%." >> "$REPORT"
          elif [ "$any_warning" = "true" ]; then
            echo "result=warning" >> "$GITHUB_OUTPUT"
            echo "⚠️ **WARNING**: One or more operations regressed by more than 20%." >> "$REPORT"
          else
            echo "result=pass" >> "$GITHUB_OUTPUT"
            echo "✅ **PASS**: No significant regressions detected." >> "$REPORT"
          fi

      - name: Upload regression report
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-regression-report-pr-${{ github.event.number }}
          path: benchmarks/regression-report.md

      - name: Comment PR
        if: github.event_name == 'pull_request' && steps.compare.outputs.has_baseline == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RESULT: ${{ steps.compare.outputs.result }}
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('benchmarks/regression-report.md', 'utf8');
            // Read result from env, never from ${{ }} inside script body.
            const result = process.env.RESULT;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Benchmark Regression Report')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: report,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: report,
              });
            }

      # Critical regression — exit 1 so the check actually fails the PR.
      - name: Report critical regression
        if: github.event_name == 'pull_request' && steps.compare.outputs.result == 'failure'
        run: |
          echo "::error::Critical benchmark regression detected (>50%). See the regression report artifact or PR comment for details."
          exit 1
