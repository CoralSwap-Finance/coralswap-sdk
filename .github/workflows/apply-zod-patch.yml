name: apply-zod-patch
on:
  push:
    branches:
      - fix/492-swap-zod-validation
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/apply_zod_patch.py
      - run: sed -i "s/tokem/token/g" src/modules/swap.ts
      - run: |
          git config user.email "isaac4real-art@users.noreply.github.com"
          git config user.name "isaac4real-art"
          git add src/modules/swap.ts
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "feat(swap): migrate validation to zod schemas"
          git push
