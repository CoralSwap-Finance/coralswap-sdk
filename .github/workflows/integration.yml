name: Integration Tests

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  integration:
    name: Testnet integration
    runs-on: ubuntu-latest
    # Allow fork PRs to fail (they won't have the secrets)
    continue-on-error: ${{ github.event.pull_request.head.repo.full_name != github.repository }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Run integration tests
        env:
          STELLAR_TESTNET: 'true'
          TEST_KEYPAIR: ${{ secrets.TEST_KEYPAIR }}
          TEST_TOKEN_A: ${{ secrets.TEST_TOKEN_A }}
          TEST_TOKEN_B: ${{ secrets.TEST_TOKEN_B }}
          # Additional fixtures used by the portfolio / risk-metrics suites.
          TEST_TOKEN_C: ${{ secrets.TEST_TOKEN_C }}
          # RedStone oracle contract used by the price-feed suite.
          REDSTONE_ORACLE_ADDRESS: ${{ secrets.REDSTONE_ORACLE_ADDRESS }}
          # Deployed fixtures used by the flash-loan suite.
          FLASH_LOAN_PAIR_ADDRESS: ${{ secrets.FLASH_LOAN_PAIR_ADDRESS }}
          FLASH_LOAN_TOKEN: ${{ secrets.FLASH_LOAN_TOKEN }}
          FLASH_LOAN_RECEIVER: ${{ secrets.FLASH_LOAN_RECEIVER }}
          FLASH_LOAN_FAILING_RECEIVER: ${{ secrets.FLASH_LOAN_FAILING_RECEIVER }}
        run: npm run test:integration
